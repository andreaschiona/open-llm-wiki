[package]
name = "open-llm-wiki"
version = "0.1.0"
description = "LLM Wiki Desktop Application"
authors = ["andreaschiona"]
edition = "2021"

[lib]
name = "open_llm_wiki_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
