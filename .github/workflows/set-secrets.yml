name: Set GitHub Secrets

on:
  push:
    branches: [set-secrets-gha]

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test gh secret set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "test-value-123" | gh secret set TEST_SECRET --repo ${{ github.repository }}
          echo "✅ Test secret set"
