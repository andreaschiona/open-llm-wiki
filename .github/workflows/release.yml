name: Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine bump
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --format="%s")
          else
            COMMITS=$(git log "$LAST_TAG..HEAD" --format="%s")
          fi
          if echo "$COMMITS" | grep -q "BREAKING CHANGE"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -q "^feat"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version
        id: version
        run: |
          CURRENT=$(grep -oP '(?<=version=)[0-9]+[.][0-9]+[.][0-9]+' VERSION || echo "0.0.0")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          sed -i "s/version=$CURRENT/version=$NEW_VERSION/" VERSION
          sed -i "s/\"version\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"version\": \"$NEW_VERSION\"/" src-tauri/tauri.conf.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add VERSION src-tauri/tauri.conf.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
          git tag v${{ steps.version.outputs.new_version }}

      - name: Push version bump
        run: |
          git push origin master
          git push origin v${{ steps.version.outputs.new_version }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          generate_release_notes: true
          make_latest: true

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.new_version }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      - name: Generate all icon formats
        shell: bash
        run: |
          npx tauri icon src-tauri/icons/icon.png

      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for i in {1..3}; do
            npm run tauri build && break
            echo "Build attempt $i failed, retrying in 30s..."
            sleep 30
          done

      - name: Create portable archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path src-tauri/target/release/open-llm-wiki.exe -DestinationPath "Open.LLM.Wiki_${{ needs.release.outputs.new_version }}_x64_portable.zip"

      - name: Generate update fragment
        shell: bash
        env:
          ARTIFACTS_DIR: src-tauri/target/release/bundle
        run: |
          node .github/scripts/generate-update-json.cjs v${{ needs.release.outputs.new_version }}
          cp update.json "update_${{ matrix.os }}.json"

      - name: Upload update fragment
        uses: actions/upload-artifact@v4
        with:
          name: update_${{ matrix.os }}
          path: update_${{ matrix.os }}.json

      - name: Upload release artifacts
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release.outputs.new_version }}
          files: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            *.zip

  build-android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.new_version }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      - name: Generate all icon formats
        shell: bash
        run: |
          npx tauri icon src-tauri/icons/icon.png

      - name: Initialize Android project
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          npx tauri android init

      - name: Decode Android keystore & configure signing
        shell: bash
        run: |
          # Write to gen/android/open_llm_wiki/ (the actual Gradle project root)
          # and android/ (source template, which gets copied to gen during init)
          for ANDROID_DIR in "src-tauri/gen/android/open_llm_wiki" "src-tauri/android"; do
            if [ -d "$ANDROID_DIR" ]; then
              echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_DIR/open-llm-wiki.keystore"
              echo "Keystore decoded to $ANDROID_DIR: $(wc -c < "$ANDROID_DIR/open-llm-wiki.keystore") bytes"
              printf '%s\n' \
                "storeFile=../open-llm-wiki.keystore" \
                "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
                "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" \
                "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" \
                > "$ANDROID_DIR/keystore.properties"
              echo "keystore.properties created in $ANDROID_DIR"
              cat "$ANDROID_DIR/keystore.properties"
            fi
          done

      - name: Build Android APK/AAB
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/src-tauri/gen/android/open_llm_wiki/open-llm-wiki.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_OK=false
          for i in {1..3}; do
            if npx tauri android build; then
              BUILD_OK=true
              break
            fi
            echo "Android build attempt $i failed, retrying in 30s..."
            sleep 30
          done
          if [ "$BUILD_OK" != "true" ]; then
            echo "::error::All 3 Android build attempts failed!"
            exit 1
          fi

      - name: Sign Android APK & AAB with apksigner (V1+V2+V3)
        shell: bash
        run: |
          # Install Android build-tools if not present (contains apksigner)
          echo "=== Ensuring Android build-tools are installed ==="
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name 'sdkmanager' -type f 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            echo "sdkmanager found: $SDKMANAGER"
            echo "y" | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" "build-tools;34.0.0" 2>&1 | tail -5 || true
            echo "y" | "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" --licenses 2>&1 | tail -3 || true
          fi
          echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"

          # Find or create the keystore file
          KEYSTORE=""
          for try in "src-tauri/gen/android" "src-tauri/android"; do
            found=$(find "$try" -name 'open-llm-wiki.keystore' -type f 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              KEYSTORE="$found"
              echo "Keystore found: $KEYSTORE ($(wc -c < "$KEYSTORE") bytes)"
              break
            fi
          done

          if [ -z "$KEYSTORE" ]; then
            GEN_DIR="src-tauri/android"
            echo "Decoding keystore directly to $GEN_DIR"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$GEN_DIR/open-llm-wiki.keystore"
            KEYSTORE="$GEN_DIR/open-llm-wiki.keystore"
          fi

          # Find apksigner in Android SDK
          APKSIGNER=""
          for try in "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk; do
            found=$(find "$try" -name 'apksigner' -type f 2>/dev/null | head -1)
            if [ -n "$found" ]; then
              APKSIGNER="$found"
              echo "apksigner found: $APKSIGNER"
              break
            fi
          done

          # Fallback: download apksigner from Google Maven
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not in SDK, downloading from Google Maven..."
            mkdir -p /tmp/apksigner-lib
            for VER in "8.5.0" "8.4.0" "8.3.0" "8.2.0"; do
              URL="https://dl.google.com/dl/android/maven2/com/android/tools/build/apksigner/$VER/apksigner-$VER.jar"
              if wget -q "$URL" -O /tmp/apksigner-lib/apksigner.jar 2>/dev/null; then
                echo "Downloaded apksigner $VER"
                break
              fi
            done
            # Create wrapper script
            printf '#!/bin/bash\n'"exec java -jar /tmp/apksigner-lib/apksigner.jar \"\$@\"\n" > /tmp/apksigner
            chmod +x /tmp/apksigner
            APKSIGNER=/tmp/apksigner
          fi

          if [ -z "$APKSIGNER" ] || [ ! -f "$APKSIGNER" ]; then
            echo "::error::apksigner not available"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"

          # Find zipalign
          ZIPALIGN=$(find "$ANDROID_SDK_ROOT" -name 'zipalign' -type f 2>/dev/null | head -1)
          echo "Using zipalign: ${ZIPALIGN:-not found}"

          # Sign all APKs
          echo "=== Signing APKs ==="
          find "src-tauri/gen/android" -name '*.apk' -type f | while read apk; do
            echo "--- Signing: $apk ---"

            # Zipalign first (4-byte alignment for V2/V3)
            if [ -n "$ZIPALIGN" ]; then
              aligned="${apk}.aligned"
              "$ZIPALIGN" -p -f 4 "$apk" "$aligned" 2>&1
              mv "$aligned" "$apk"
              echo "  Zipaligned: $apk"
            fi

            # Sign with apksigner (creates V1+V2+V3 automatically)
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$apk" 2>&1

            # Verify
            "$APKSIGNER" verify --verbose "$apk" 2>&1 | tail -5
            if [ $? -eq 0 ]; then
              echo "  ✅ APK SIGNED & VERIFIED: $apk"
            else
              echo "  ❌ VERIFICATION FAILED: $apk"
            fi
          done

          # Sign all AABs
          echo "=== Signing AABs ==="
          find "src-tauri/gen/android" -name '*.aab' -type f | while read aab; do
            echo "--- Signing: $aab ---"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
              "$aab" 2>&1

            "$APKSIGNER" verify --verbose "$aab" 2>&1 | tail -5
            if [ $? -eq 0 ]; then
              echo "  ✅ AAB SIGNED & VERIFIED: $aab"
            else
              echo "  ❌ VERIFICATION FAILED: $aab"
            fi
          done

          echo "=== All signing complete ==="

      - name: Upload Android APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            src-tauri/gen/android/open_llm_wiki/app/build/outputs/apk/**/*.apk

      - name: Upload Android AAB (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: |
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

      - name: Upload release artifacts
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release.outputs.new_version }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  merge-update:
    needs: [release, build, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.release.outputs.new_version }}

      - name: Download all update fragments
        uses: actions/download-artifact@v4
        with:
          pattern: update_*
          merge-multiple: true

      - name: Merge update fragments
        shell: bash
        run: |
          VERSION="${{ needs.release.outputs.new_version }}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo '{
            "version": "'"$VERSION"'",
            "pub_date": "'"$PUB_DATE"'",
            "platforms": {' > update.json
          first=true
          for f in update_*.json; do
            "$first" || echo "," >> update.json
            first=false
            # Extract platform key from filename (update_ubuntu-latest.json -> ubuntu-latest)
            platform_key=$(echo "$f" | sed 's/^update_//;s/\.json$//')
            # Map GitHub runner names to Tauri platform keys
            case "$platform_key" in
              ubuntu-latest)   plat="linux-x86_64" ;;
              macos-latest)    plat="darwin-aarch64" ;;
              windows-latest)  plat="windows-x86_64" ;;
              *)               plat="$platform_key" ;;
            esac
            content=$(jq '.platforms | to_entries[0].value' "$f")
            echo '    "'"$plat"'": '"$content" >> update.json
          done
          echo '  }
          }' >> update.json
          jq '.' update.json > update.json.tmp && mv update.json.tmp update.json
          echo "Merged update.json:"
          cat update.json

      - name: Upload merged update.json
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release.outputs.new_version }}
          files: update.json

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ needs.release.outputs.new_version }}';
            const runUrl = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const title = `Release merge-update failed for v${version}`;
            const body = `## Build Failure

            ### Run
            [Workflow run #${{ github.run_id }}](${runUrl})

            ### Platform
            ${os}

            ### Version
            v${version}

            ### Action
            The \`Build Tauri app\` step failed during the release workflow for ${os}.

            Please check the workflow logs for details and re-run the failed job after resolving the issue.
            `;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['build', 'automated']
            });
