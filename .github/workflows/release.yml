name: Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine bump
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --format="%s")
          else
            COMMITS=$(git log "$LAST_TAG..HEAD" --format="%s")
          fi
          if echo "$COMMITS" | grep -q "BREAKING CHANGE"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -q "^feat"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version
        id: version
        run: |
          CURRENT=$(grep -oP '(?<=version=)[0-9]+[.][0-9]+[.][0-9]+' VERSION || echo "0.0.0")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          sed -i "s/version=$CURRENT/version=$NEW_VERSION/" VERSION
          sed -i "s/\"version\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"version\": \"$NEW_VERSION\"/" src-tauri/tauri.conf.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add VERSION src-tauri/tauri.conf.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]"
          git tag v${{ steps.version.outputs.new_version }}

      - name: Push version bump
        run: |
          git push origin master
          git push origin v${{ steps.version.outputs.new_version }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          generate_release_notes: true
          make_latest: true

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      - name: Generate app icon
        run: |
          node -e "
          const fs = require('fs');
          const zlib = require('zlib');
          function crc32(buf) {
            let c = 0xffffffff;
            for (let i = 0; i < buf.length; i++) { c ^= buf[i]; for (let j = 0; j < 8; j++) c = c & 1 ? (c >>> 1) ^ 0xedb88320 : c >>> 1; }
            return (c ^ 0xffffffff) >>> 0;
          }
          function chunk(t, d) { const l = Buffer.alloc(4); l.writeUInt32BE(d.length); const tb = Buffer.from(t); const crc = Buffer.alloc(4); crc.writeUInt32BE(crc32(Buffer.concat([tb, d]))); return Buffer.concat([l, tb, d, crc]); }
          const s = Buffer.from([137,80,78,71,13,10,26,10]);
          const ih = Buffer.alloc(13); ih.writeUInt32BE(1024,0); ih.writeUInt32BE(1024,4); ih[8]=8; ih[9]=2;
          const r = []; for (let y = 0; y < 1024; y++) { r.push(0); for (let x = 0; x < 1024; x++) r.push(59,130,246); }
          const id = chunk('IDAT', zlib.deflateSync(Buffer.from(r)));
          const ie = chunk('IEND', Buffer.alloc(0));
          fs.writeFileSync('icon.png', Buffer.concat([s, chunk('IHDR', ih), id, ie]));
          "

      - name: Generate all icon formats
        run: |
          npx tauri icon icon.png
          if [ -d icons ]; then cp -r icons/* src-tauri/icons/ 2>/dev/null || true; fi

      - name: Build Tauri app
        run: npm run tauri build

      - name: Create portable archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path src-tauri/target/release/open-llm-wiki.exe -DestinationPath "Open.LLM.Wiki_${{ needs.release.outputs.new_version }}_x64_portable.zip"

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release.outputs.new_version }}
          files: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            *.zip
