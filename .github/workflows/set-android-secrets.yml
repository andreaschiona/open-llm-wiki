name: Set Android Secrets
on:
  push:
    branches: [set-secrets-gha]
jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate keystore and set secrets
        run: |
          PWD=$(openssl rand -hex 16)
          ALIAS="open-llm-wiki"
          keytool -genkey -v -keystore wiki.keystore -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PWD" -keypass "$PWD" -dname "CN=Andrea, OU=Dev, O=Wiki, L=Padua, ST=Italy, C=IT" -noprompt
          base64 wiki.keystore | tr -d '\n' > b64.txt
          echo "$(cat b64.txt)" | gh secret set ANDROID_KEYSTORE_BASE64 --repo andreaschiona/open-llm-wiki
          echo "$PWD" | gh secret set ANDROID_KEYSTORE_PASSWORD --repo andreaschiona/open-llm-wiki
          echo "$ALIAS" | gh secret set ANDROID_KEY_ALIAS --repo andreaschiona/open-llm-wiki
          echo "$PWD" | gh secret set ANDROID_KEY_PASSWORD --repo andreaschiona/open-llm-wiki
