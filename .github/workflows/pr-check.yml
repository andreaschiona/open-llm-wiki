name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0



      - name: Lint
        run: echo 'no linter'

      - name: Test
        run: echo 'no tests'

      - name: Build
        run: echo 'no build'
