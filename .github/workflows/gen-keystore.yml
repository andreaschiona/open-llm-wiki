name: Generate Android Keystore

on:
  push:
    branches: [gen-keystore-gha]

permissions:
  contents: read
  secrets: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate keystore
        run: |
          PASSWORD=$(openssl rand -hex 16)
          ALIAS="open-llm-wiki"
          echo "STORE_PASSWORD=$PASSWORD" > keystore-secrets.txt
          echo "KEY_ALIAS=$ALIAS" >> keystore-secrets.txt
          echo "KEY_PASSWORD=$PASSWORD" >> keystore-secrets.txt
          keytool -genkey -v \
            -keystore open-llm-wiki.keystore \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -dname "CN=Andrea Schiona, OU=Development, O=open-llm-wiki, L=Padua, ST=Italy, C=IT" \
            -noprompt

      - name: Encode keystore
        run: |
          base64 open-llm-wiki.keystore | tr -d '\n' > keystore-base64.txt
          echo "BASE64 size: $(wc -c < keystore-base64.txt) bytes"

      - name: Set GitHub secrets
        run: |
          # Read password from secrets file
          STORE_PASS=$(grep STORE_PASSWORD keystore-secrets.txt | cut -d= -f2)
          KEY_ALIAS=$(grep KEY_ALIAS keystore-secrets.txt | cut -d= -f2)
          KEY_PASS=$(grep KEY_PASSWORD keystore-secrets.txt | cut -d= -f2)
          KEYSTORE_B64=$(cat keystore-base64.txt)

          # Set secrets using gh CLI
          echo "$KEYSTORE_B64" | gh secret set ANDROID_KEYSTORE_BASE64 --repo ${{ github.repository }}
          echo "$STORE_PASS"   | gh secret set ANDROID_KEYSTORE_PASSWORD --repo ${{ github.repository }}
          echo "$KEY_ALIAS"    | gh secret set ANDROID_KEY_ALIAS --repo ${{ github.repository }}
          echo "$KEY_PASS"     | gh secret set ANDROID_KEY_PASSWORD --repo ${{ github.repository }}
          echo "✅ All 4 secrets set successfully"

      - name: Upload secrets file
        uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: |
            keystore-secrets.txt
            keystore-base64.txt
            open-llm-wiki.keystore
          retention-days: 1
