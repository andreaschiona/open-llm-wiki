---
root: true

env:
  browser: true
  es6: true
  jest: true
  node: true

ignorePatterns:
  - "!.*"
  - "**/node_modules/.*"

plugins:
  - n
  - prettier

overrides:
  - files:
      - "**/*.ts"
      - "**/*.cts"
      - "**/*.mts"
      - "**/*.tsx"
    extends:
      - "plugin:@typescript-eslint/recommended"
      - plugin:n/recommended
      - prettier
    parser: "@typescript-eslint/parser"
    plugins:
      - "@typescript-eslint"
    parserOptions:
      ecmaVersion: latest
      sourceType: module
    rules:
      "n/no-missing-import": "off"
      "n/no-unsupported-features/es-syntax": "off"
      "n/no-unsupported-features/node-builtins": "off"

  - files:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.jsx"
    parserOptions:
      sourceType: module
      ecmaVersion: latest
      ecmaFeatures:
        jsx: true
        modules: true
